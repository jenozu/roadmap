name: Bootstrap Voyages source
on:
  push:
    branches: [main]
    paths: ["roadmap-source.b64"]
permissions:
  contents: write
jobs:
  install-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Unpack verified source archive and commit
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode roadmap-source.b64 | tar -xJf -
          rm roadmap-source.b64
          rm .github/workflows/bootstrap.yml
          rmdir .github/workflows || true
          rmdir .github || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: scaffold Voyages pirate-map dashboard and GitHub sync"
          git push origin HEAD:main
      - name: Install dependencies and run tests
        run: |
          npm install --no-audit --no-fund
          npm test
          npm run lint
          npm run build
