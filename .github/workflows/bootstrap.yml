name: Bootstrap Voyages source
on:
  push:
    branches: [main]
    paths: ["roadmap-source.b64"]
permissions:
  contents: write
jobs:
  install-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract source snapshot and commit
        shell: bash
        run: |
          set -euo pipefail
          cat roadmap-part-{0..4}.b64 | base64 --decode > /tmp/voyage.tar.xz
          echo "eec55d5f036a7e455ea340b196cbf770bd31571ac32b8bc33535c6e58e3528db  /tmp/voyage.tar.xz" | sha256sum --check
          tar -xJf /tmp/voyage.tar.xz
          rm -f roadmap-part-{0..4}.b64 roadmap-source.b64 .github/workflows/bootstrap.yml
          rmdir .github/workflows .github || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: scaffold Voyages pirate-map dashboard and GitHub sync"
          git push origin HEAD:main
      - name: Verify source
        run: |
          npm install --no-audit --no-fund
          npm test
          npm run lint
          npm run build
