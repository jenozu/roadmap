name: Verify atlas interactions
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/components/dashboard.tsx"
      - "src/app/globals.css"
      - "src/lib/map-camera.ts"
      - "e2e/**"
      - "playwright.config.ts"
      - "package.json"
      - ".github/workflows/atlas-e2e.yml"
permissions:
  contents: read
jobs:
  atlas-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: atlas-browser-traces
          path: test-results
          retention-days: 5
